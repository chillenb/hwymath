name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # random inputs per function for the cross-machine bit-identity check (same on every machine)
  HASH_INPUTS: "2000000"

jobs:
  x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e  # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true
      - name: CPU
        id: cpu
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Socket"
          echo "SIMD: $(grep -oE '\b(avx2|fma|avx512[a-z_0-9]*)\b' /proc/cpuinfo | sort -u | tr '\n' ' ')"
          if grep -qw avx512f /proc/cpuinfo; then echo "avx512=true" >> "$GITHUB_OUTPUT"; else echo "avx512=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        run: pixi run make all
      - name: Tests
        run: pixi run make test
      - name: Result hashes of every function (cross-machine check)
        run: pixi run make hashes HASH_INPUTS="$HASH_INPUTS" HASH_FILE=hashes-x86_64.txt
      # AVX-512 correctness under Intel SDE (Sapphire Rapids) if this runner has no AVX-512
      - uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec  # v6.0
        if: steps.cpu.outputs.avx512 != 'true'
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1
      - name: AVX-512 tests under SDE
        if: steps.cpu.outputs.avx512 != 'true'
        run: pixi run make avx512-test RUN="$SDE_PATH/sde64 -spr --" HASH_INPUTS="$HASH_INPUTS" HASH_FILE=hashes-x86_64-sde.txt
      - name: Highway versions on all targets, with comparisons and benchmarks
        run: pixi run make hwy
      - name: Accuracy comparisons with Intel SVML, glibc, libmvec, SLEEF
        run: pixi run make compare
      - name: Throughput
        run: pixi run make bench
      - name: Instruction mix of the C translations vs Intel's assembly
        run: pixi run make insns
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hashes-x86_64
          path: hashes-x86_64*.txt

  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e  # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true
      - name: CPU
        run: |
          lscpu | grep -E "Model name|Vendor|^CPU\(s\)"
          grep -m1 Features /proc/cpuinfo
      - name: Build
        run: pixi run make all
      - name: Tests
        run: pixi run make test
      - name: Result hashes of every function (cross-machine check)
        run: pixi run make hashes HASH_INPUTS="$HASH_INPUTS" HASH_FILE=hashes-aarch64.txt
      - name: Highway versions on all targets, with comparisons and benchmarks
        run: pixi run make hwy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hashes-aarch64
          path: hashes-aarch64.txt

  cross-check:
    needs: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: hashes-*
          merge-multiple: true
      - name: Results identical across machines and targets
        run: python3 common/tools/check_hashes.py hashes-*.txt
